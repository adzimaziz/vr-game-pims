  <b>DATA SORTER</b> — sort the plant data to the beat<br>
  In VR: press <b>ENTER VR</b>, then pull <b>both triggers</b> to start. <b>B / Y</b> = back to menu.<br>
  Blue data → <b>left</b> hand · Red anomaly → <b>right</b> hand.<br><br>
  Desktop test: <span class="k">Space</span> start · <span class="k">F</span> left · <span class="k">J</span> right · <span class="k">M</span> menu
